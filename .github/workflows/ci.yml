name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  lint-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff>=0.6"
      - name: Ruff check
        run: ruff check .
      - name: Compileall (no GPU)
        run: python -m compileall -q -f .
